[package]
name = "pinball-aio"
version = "0.2.0"
edition = "2021"
description = "Libreria di tavoli per VPinballX che scarica il motore e avvia i tavoli"
license = "MIT"

[dependencies]
anyhow = "1"
cfb = "0.10"
dirs = "6"
eframe = "0.31"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu"] }
