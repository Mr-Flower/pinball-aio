[package]
name = "pinball-aio"
version = "0.1.1"
edition = "2021"
description = "Launcher che scarica, aggiorna e avvia VPinballX e VPinFE"
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
eframe = "0.31"
flate2 = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
